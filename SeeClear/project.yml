name: SeeClear
options:
  bundleIdPrefix: com.samkit.seeclear
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_PREVIEWS: NO
    ENABLE_DEBUG_DYLIB: NO
targets:
  SeeClear:
    type: application
    platform: iOS
    sources:
      - path: SeeClear
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samkit.seeclear
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: SeeClear/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: "Default Configuration"
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
  SeeClearTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SeeClearTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samkit.seeclear.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SeeClear
schemes:
  SeeClear:
    build:
      targets:
        SeeClear: all
        SeeClearTests: [test]
    test:
      targets:
        - SeeClearTests
